[package]
name = "relay-watcher"
description = "Wakes idle team leads on this machine by typing ix-relay messages in through herdr."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "relay-watcher"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ix-trace-rs = { git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.1" }
claude-wire.workspace = true
relay-core.workspace = true
relay-ops.workspace = true
herdr-cli.workspace = true
host-probe.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
signal-hook.workspace = true
nix.workspace = true
toml.workspace = true
jiff.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

[dev-dependencies]
relay-core = { workspace = true, features = ["test-support"] }
ix-cli-kit.workspace = true
proptest.workspace = true
redis.workspace = true
relay-test-support.workspace = true
tempfile.workspace = true
