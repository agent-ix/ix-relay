secrets:
  - name: relay-redis-admin
    namespace: relay
    keys:
      # The `admin` ACL user: used only by scripts/relay-admin (inside the pod)
      # to create and remove the per-machine users. Leads never see it.
      - secretKey: ADMIN_PASSWORD
        env:
          - RELAY_REDIS_ADMIN_PASSWORD
        prompt: Password for relay-redis's admin ACL user
        generate: randomHex32
