name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version to publish (no leading v)"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4

      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Version '$VERSION' is not SemVer (expected X.Y.Z[-pre])" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Lint dashboard chart
        run: helm lint helm/agent-spend-dashboard

      - name: Helm registry login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package and push dashboard chart
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p dist/charts
          helm package helm/agent-spend-dashboard \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination dist/charts
          helm push "dist/charts/agent-spend-dashboard-$VERSION.tgz" \
            oci://ghcr.io/agent-ix/ix-relay

      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes

      - name: Write summary
        run: |
          echo "### Published agent-spend-dashboard ${{ steps.ver.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "OCI: oci://ghcr.io/agent-ix/ix-relay/agent-spend-dashboard" >> "$GITHUB_STEP_SUMMARY"
